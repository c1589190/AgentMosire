schema: spec-driven

context: |
  Language: 简体中文
  All artifacts must be written in 简体中文.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  AgentMosire 提供 Java 21 / Maven Agent 运行时。仓库内规范以最新已确认的用户裁定为准，历史原话按时间追加保存。
  变更模块边界、运行时阶段、公开 API、权限、持久状态、数据流或生命周期时，先更新架构设计和对应规格，再开始实现。
  调查结论引用可核对的源码或测试。计划行为、当前行为和验收结果分别标明。

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  proposal:
    - 写清本阶段交付目标、涉及的模块和验收边界。
  design:
    - 列出数据与状态的所有者、调用方向、故障结果及验证方法。
    - 对直接引用的用户裁定保留原文并链接到对应设计。后续裁定注明取代的条目，保留旧原文。
    - 将已确认的裁定、设计建议和待裁定事项明确标记。实现调整碰到已确认裁定时先更新设计并取得用户明确结论。
  specs:
    - 写出可观察的行为，对允许、拒绝、重试和边界条件提供场景。
  tasks:
    - 为每组任务写明交付物与可执行的验收判据，标注结论所依据的本轮命令或产物。
